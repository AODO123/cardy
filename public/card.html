<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cardy — your tiny digital card</title>
  <link rel="icon" type="image/png" href="/cardy.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/"><img src="/cardy.png" alt="" class="logo-img"> cardy</a>
    <span class="tagline">your tiny digital card</span>
  </header>

  <main class="wrap">
    <section class="panel card-panel">
      <div id="card" class="digital-card"></div>
      <p id="message" class="hint" style="margin-top: 16px;"></p>
      <a class="card-cta" href="/">Create your own card</a>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 cardy &middot; All rights reserved</p>
    <p>Created by Costa</p>
  </footer>

  <script src="/render-card.js"></script>
  <script>
    const id = location.pathname.split('/').filter(Boolean).pop();
    const el = document.getElementById('card');
    const msg = document.getElementById('message');

    fetch('/api/cards/' + encodeURIComponent(id))
      .then(async (res) => {
        if (!res.ok) throw new Error('not-found');
        const card = await res.json();
        document.title = card.name + ' — cardy';
        renderCardData(card, el);
        msg.innerHTML = '&#128279; This card lives at <code>' + escapeHtml(location.href) + '</code>';
      })
      .catch(() => {
        el.innerHTML = '<div class="card-name">Card not found</div>';
        msg.textContent = 'Sorry, that card doesn’t exist.';
      });
  </script>
</body>
</html>
