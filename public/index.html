<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a tiny digital card about yourself and share it with one link.">
  <title>cardy — your tiny digital card</title>
  <link rel="icon" type="image/png" href="/cardy.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/"><img src="/cardy.png" alt="" class="logo-img"> cardy</a>
    <span class="tagline">your tiny digital card</span>
  </header>

  <div id="limit-banner" class="limit-banner" hidden>
    <div class="limit-text">
      <strong id="limit-title"></strong>
      <span id="limit-sub"></span>
    </div>
    <div id="limit-links" class="limit-links"></div>
    <button type="button" id="limit-edit" class="primary">Edit my card</button>
  </div>

  <main class="wrap">
    <section class="panel">
      <h1 id="form-title">Create your card</h1>
      <p class="panel-intro">Tell people who you are. Optional fields can be left blank.</p>

      <form id="card-form" autocomplete="off">
        <label>
          Name <em>*</em>
          <input name="name" required placeholder="john doe">
        </label>

        <div class="field-group photo-field">
          <label class="group-label">Photo <span class="optional">optional</span></label>
          <div id="photo-drop" class="photo-drop" role="button" tabindex="0" aria-label="Add a photo">
            <input id="photo-input" type="file" accept="image/*" hidden>
            <img id="photo-preview" class="photo-preview" alt="" hidden>
            <div id="photo-placeholder" class="photo-placeholder">
              <span class="photo-plus">+</span>
              <span>Photo</span>
            </div>
            <button type="button" id="photo-remove" class="photo-remove" aria-label="Remove photo" title="Remove photo" hidden>&times;</button>
          </div>
        </div>

        <fieldset class="role">
          <legend>What do you do?</legend>
          <div class="role-options">
            <label class="role-opt">
              <input type="radio" name="role" value="job" checked>
              <span><img src="/job.png" alt="" class="role-icon"> I work</span>
            </label>
            <label class="role-opt">
              <input type="radio" name="role" value="student">
              <span><img src="/student.png" alt="" class="role-icon"> I study</span>
            </label>
          </div>
        </fieldset>

        <label>
          Title or focus <span class="optional">optional</span>
          <input name="roleLabel" placeholder="e.g. Software Engineer, barista, Computer Science">
        </label>

        <div class="row">
          <label>
            Age <em>*</em>
            <input name="age" type="number" min="1" max="130" placeholder="20" required>
          </label>
          <label>
            Country <span class="optional">optional</span>
            <select name="country" id="country"></select>
          </label>
        </div>

        <label>
          About me <span class="optional">optional</span>
          <textarea name="aboutMe" rows="4" placeholder="Tell people a bit about yourself&hellip;"></textarea>
        </label>

        <div class="field-group">
          <label class="group-label">Social media <span class="optional">optional</span></label>
          <div class="social-inputs">
            <div class="social-input-row">
              <img src="/discord.png" alt="" class="platform-icon">
              <input name="social_discord" placeholder="username">
            </div>
            <div class="social-input-row">
              <img src="/x.png" alt="" class="platform-icon">
              <input name="social_x" placeholder="username">
            </div>
            <div class="social-input-row">
              <img src="/instagram.png" alt="" class="platform-icon">
              <input name="social_instagram" placeholder="username">
            </div>
            <div class="social-input-row">
              <img src="/tiktok.png" alt="" class="platform-icon">
              <input name="social_tiktok" placeholder="username">
            </div>
          </div>
        </div>

        <label>
          Website <span class="optional">optional</span>
          <input name="website" inputmode="url" placeholder="https://yoursite.com">
        </label>

        <div class="field-group">
          <label class="group-label">More about you</label>
          <div class="tile-grid">
            <label class="tile">
              <span class="tile-label">Personality / MBTI <span class="optional">optional</span></span>
              <input name="mbti" list="mbti-types" placeholder="e.g. INFJ">
            </label>
            <label class="tile">
              <span class="tile-label">Interests <span class="optional">optional</span></span>
              <input name="interests" placeholder="e.g. photography">
            </label>
            <label class="tile">
              <span class="tile-label">Favorite song <span class="optional">optional</span></span>
              <input name="favoriteSong" placeholder="e.g. Billie Jean">
            </label>
            <label class="tile">
              <span class="tile-label">Favorite movie / series <span class="optional">optional</span></span>
              <input name="favoriteMovie" placeholder="e.g. The Matrix">
            </label>
          </div>
          <datalist id="mbti-types">
            <option value="INTJ"></option><option value="INTP"></option>
            <option value="ENTJ"></option><option value="ENTP"></option>
            <option value="INFJ"></option><option value="INFP"></option>
            <option value="ENFJ"></option><option value="ENFP"></option>
            <option value="ISTJ"></option><option value="ISFJ"></option>
            <option value="ESTJ"></option><option value="ESFJ"></option>
            <option value="ISTP"></option><option value="ISFP"></option>
            <option value="ESTP"></option><option value="ESFP"></option>
          </datalist>
        </div>

        <button type="submit" id="submit-btn" class="primary">Create card</button>
        <p id="form-error" class="error" hidden></p>
      </form>
    </section>

    <section class="panel">
      <h2>Preview</h2>
      <div id="preview" class="digital-card"></div>

      <div id="result" hidden>
        <h2>Your card is live! &#127881;</h2>
        <div class="link-row">
          <a id="share-link" target="_blank" rel="noopener"></a>
          <button type="button" data-copy="share-link">Copy</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 cardy &middot; All rights reserved</p>
    <p>Created by <a class="credit-link" href="/card/88603c">Costa</a></p>
  </footer>

  <script src="/render-card.js"></script>
  <script>
    const form = document.getElementById('card-form');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    const formError = document.getElementById('form-error');
    const shareLink = document.getElementById('share-link');
    const resultTitle = result.querySelector('h2');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');

    // Photo upload state.
    const photoDrop = document.getElementById('photo-drop');
    const photoInput = document.getElementById('photo-input');
    const photoPreview = document.getElementById('photo-preview');
    const photoPlaceholder = document.getElementById('photo-placeholder');
    const photoRemove = document.getElementById('photo-remove');
    let photoData = ''; // base64 data URI; '' means no photo

    // Daily-limit + edit state.
    const limitBanner = document.getElementById('limit-banner');
    const limitTitle = document.getElementById('limit-title');
    const limitSub = document.getElementById('limit-sub');
    const limitLinks = document.getElementById('limit-links');
    const limitEdit = document.getElementById('limit-edit');
    let editingId = null;

    // Every country, for the dropdown.
    const COUNTRIES = [
      'Afghanistan','Albania','Algeria','Andorra','Angola','Antigua and Barbuda','Argentina','Armenia','Australia','Austria','Azerbaijan',
      'Bahamas','Bahrain','Bangladesh','Barbados','Belarus','Belgium','Belize','Benin','Bhutan','Bolivia','Bosnia and Herzegovina','Botswana','Brazil','Brunei','Bulgaria','Burkina Faso','Burundi',
      'Cabo Verde','Cambodia','Cameroon','Canada','Central African Republic','Chad','Chile','China','Colombia','Comoros','Congo (DRC)','Congo (Republic)','Costa Rica','Cote d’Ivoire','Croatia','Cuba','Cyprus','Czechia',
      'Denmark','Djibouti','Dominica','Dominican Republic',
      'Ecuador','Egypt','El Salvador','Equatorial Guinea','Eritrea','Estonia','Eswatini','Ethiopia',
      'Fiji','Finland','France',
      'Gabon','Gambia','Georgia','Germany','Ghana','Greece','Grenada','Guatemala','Guinea','Guinea-Bissau','Guyana',
      'Haiti','Honduras','Hungary',
      'Iceland','India','Indonesia','Iran','Iraq','Ireland','Israel','Italy',
      'Jamaica','Japan','Jordan',
      'Kazakhstan','Kenya','Kiribati','Kuwait','Kyrgyzstan',
      'Laos','Latvia','Lebanon','Lesotho','Liberia','Libya','Liechtenstein','Lithuania','Luxembourg',
      'Madagascar','Malawi','Malaysia','Maldives','Mali','Malta','Marshall Islands','Mauritania','Mauritius','Mexico','Micronesia','Moldova','Monaco','Mongolia','Montenegro','Morocco','Mozambique','Myanmar',
      'Namibia','Nauru','Nepal','Netherlands','New Zealand','Nicaragua','Niger','Nigeria','North Korea','North Macedonia','Norway',
      'Oman',
      'Pakistan','Palau','Palestine','Panama','Papua New Guinea','Paraguay','Peru','Philippines','Poland','Portugal',
      'Qatar',
      'Romania','Russia','Rwanda',
      'Saint Kitts and Nevis','Saint Lucia','Saint Vincent and the Grenadines','Samoa','San Marino','Sao Tome and Principe','Saudi Arabia','Senegal','Serbia','Seychelles','Sierra Leone','Singapore','Slovakia','Slovenia','Solomon Islands','Somalia','South Africa','South Korea','South Sudan','Spain','Sri Lanka','Sudan','Suriname','Sweden','Switzerland','Syria',
      'Taiwan','Tajikistan','Tanzania','Thailand','Timor-Leste','Togo','Tonga','Trinidad and Tobago','Tunisia','Turkey','Turkmenistan','Tuvalu',
      'Uganda','Ukraine','United Arab Emirates','United Kingdom','United States','Uruguay','Uzbekistan',
      'Vanuatu','Vatican City','Venezuela','Vietnam',
      'Yemen',
      'Zambia','Zimbabwe'
    ];
    (function populateCountries() {
      const select = document.getElementById('country');
      const empty = document.createElement('option');
      empty.value = '';
      empty.textContent = 'Select your country…';
      select.appendChild(empty);
      for (const c of COUNTRIES) {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      }
    })();

    // The platforms we take a username for.
    const PLATFORMS = ['discord', 'x', 'instagram', 'tiktok'];

    // --- photo upload ---
    function setPhoto(dataUri) {
      photoData = dataUri;
      if (dataUri) {
        photoPreview.src = dataUri;
        photoPreview.hidden = false;
        photoPlaceholder.hidden = true;
        photoRemove.hidden = false;
        photoDrop.classList.add('has-photo');
      } else {
        photoPreview.removeAttribute('src');
        photoPreview.hidden = true;
        photoPlaceholder.hidden = false;
        photoRemove.hidden = true;
        photoDrop.classList.remove('has-photo');
      }
      renderCardData(currentData(), preview);
    }

    // Resize the picked image to a 400×400 JPEG on a canvas, so the stored
    // card stays small and the photo is always square regardless of input.
    function readPhotoFile(file) {
      if (!file || !file.type || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const size = 400;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const side = Math.min(img.width, img.height);
          ctx.drawImage(
            img,
            (img.width - side) / 2, (img.height - side) / 2, side, side,
            0, 0, size, size
          );
          setPhoto(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    photoDrop.addEventListener('click', () => photoInput.click());
    photoDrop.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        photoInput.click();
      }
    });
    photoDrop.addEventListener('dragover', (e) => {
      e.preventDefault();
      photoDrop.classList.add('dragging');
    });
    photoDrop.addEventListener('dragleave', () => photoDrop.classList.remove('dragging'));
    photoDrop.addEventListener('drop', (e) => {
      e.preventDefault();
      photoDrop.classList.remove('dragging');
      readPhotoFile(e.dataTransfer.files && e.dataTransfer.files[0]);
    });
    photoInput.addEventListener('change', () => {
      readPhotoFile(photoInput.files[0]);
      photoInput.value = '';
    });
    photoRemove.addEventListener('click', (e) => {
      e.stopPropagation();
      setPhoto('');
    });

    // --- one card per day + editing ---
    // Fill the form with an existing card and switch to edit mode. The daily
    // limit never applies to editing your own card.
    function startEditing(card) {
      editingId = card.id;
      form.elements.name.value = card.name || '';
      form.elements.age.value = card.age != null ? card.age : '';
      form.elements.country.value = card.country || '';
      const roleEl = form.elements.role;
      for (const r of roleEl) if (r.value === (card.role || 'job')) r.checked = true;
      form.elements.roleLabel.value = card.roleLabel || '';
      form.elements.aboutMe.value = card.aboutMe || '';
      form.elements.website.value = card.website || '';
      form.elements.mbti.value = card.mbti || '';
      form.elements.interests.value = card.interests || '';
      form.elements.favoriteSong.value = card.favoriteSong || '';
      form.elements.favoriteMovie.value = card.favoriteMovie || '';
      for (const s of card.socials || []) {
        const el = form.elements['social_' + s.platform];
        if (el) el.value = s.handle || '';
      }
      setPhoto(card.photo || '');

      formTitle.textContent = 'Edit your card';
      submitBtn.textContent = 'Update card';
      document.body.classList.remove('limited');
      form.removeAttribute('inert');
      limitBanner.hidden = true;
      form.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Ask the server whether this browser hit today's limit. When it has,
    // dim the create form and explain; otherwise offer editing of old cards.
    async function checkLimit() {
      let data;
      try {
        const res = await fetch('/api/daily-limit');
        data = await res.json();
      } catch {
        return; // leave the form normal if the check fails
      }
      const limited = !!(data && data.limited);
      const cards = (data && data.cards) || [];

      if (limited) {
        document.body.classList.add('limited');
        form.setAttribute('inert', '');
        limitTitle.textContent = 'You already created a card today';
        limitSub.textContent = 'Come back tomorrow to make another one — or edit the card you have.';
      } else if (cards.length) {
        document.body.classList.remove('limited');
        form.removeAttribute('inert');
        limitTitle.textContent = 'You already have a card';
        limitSub.textContent = 'You can make a new one today, or keep editing the one you have.';
      } else {
        document.body.classList.remove('limited');
        form.removeAttribute('inert');
        limitBanner.hidden = true;
        return;
      }

      limitLinks.innerHTML = '';
      for (const c of cards) {
        const a = document.createElement('a');
        a.href = c.shareUrl || ('/card/' + c.id);
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = (c.name || 'Your') + '’s card';
        limitLinks.appendChild(a);
      }
      limitEdit.hidden = false;
      limitEdit.onclick = () => startEditing(data.today || cards[cards.length - 1]);
      limitBanner.hidden = false;
    }

    // Read the form into the same shape the API expects.
    function val(name) {
      const el = form.elements[name];
      return el ? el.value : '';
    }

    function currentData() {
      const socials = PLATFORMS
        .filter((p) => val('social_' + p))
        .map((p) => ({ platform: p, handle: val('social_' + p).trim() }));
      const data = {
        name: val('name'),
        age: val('age'),
        country: val('country'),
        role: val('role') || 'job',
        roleLabel: val('roleLabel'),
        aboutMe: val('aboutMe'),
        socials,
        website: val('website'),
        mbti: val('mbti'),
        interests: val('interests'),
        favoriteSong: val('favoriteSong'),
        favoriteMovie: val('favoriteMovie'),
        photo: photoData || null,
      };
      if (editingId) data._editId = editingId;
      return data;
    }

    form.addEventListener('input', () => renderCardData(currentData(), preview));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formError.hidden = true;
      try {
        const res = await fetch('/api/cards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentData()),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          formError.textContent = data.error || 'Something went wrong. Try again.';
          formError.hidden = false;
          return;
        }

        const card = await res.json();
        renderCardData(card, preview);

        resultTitle.textContent = editingId ? 'Your card is updated! 🎉' : 'Your card is live! 🎉';
        shareLink.href = card.shareUrl;
        shareLink.textContent = card.shareUrl;

        result.hidden = false;
        result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        checkLimit(); // a fresh create now blocks until tomorrow
      } catch {
        formError.textContent = 'Something went wrong. Try again.';
        formError.hidden = false;
      }
    });

    document.querySelectorAll('[data-copy]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const el = document.getElementById(btn.dataset.copy);
        try {
          await navigator.clipboard.writeText(el.href);
          btn.textContent = 'Copied!';
          setTimeout(() => (btn.textContent = 'Copy'), 1500);
        } catch {
          prompt('Copy this link:', el.href);
        }
      });
    });

    renderCardData(currentData(), preview);
    checkLimit();
  </script>
</body>
</html>
